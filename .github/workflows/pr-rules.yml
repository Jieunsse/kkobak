name: pr-rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - run: node --test .github/scripts/pr-rules.test.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPr } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-rules.mjs`);
            const pr = context.payload.pull_request;
            const files = (await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            })).map((f) => f.filename);
            const { errors, labels } = checkPr({ title: pr.title, branch: pr.head.ref, body: pr.body ?? '', files });
            const current = pr.labels.map((l) => l.name);
            for (const [name, on] of Object.entries(labels)) {
              if (on && !current.includes(name)) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [name] });
              } else if (!on && current.includes(name)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name });
              }
            }
            if (errors.length) core.setFailed(errors.map((e) => `- ${e}`).join('\n'));
